# The suite reaches no network and needs no packages, so CI is genuinely this small.
# ⚠️ A stranger cloning this and finding a red suite concludes the project is broken, which
# is why the tests run on the oldest supported interpreter as well as the newest.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 tests/test_archive.py
